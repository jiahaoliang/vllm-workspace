{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "layerwise-performance-aisbench",
    "namespace": "liangjiahao",
    "annotations": {
      "performance.vllm.ai/source-image": "docker.io/library/vllm-ascend:kv-pool-layerwise-main-54503ece-a2-57d3c214e-df3f74ed-20260811T145302Z",
      "performance.vllm.ai/repo-digest": "sha256:f8592141757f7e9976898858863e12ccd051ac4a3fd6ade7591f78d9769517e3",
      "performance.vllm.ai/config-digest": "sha256:ce20411d6043d3830be7601c654b2c9a1d41fb923395cad2ea2e7ba200ebbbbd",
      "performance.vllm.ai/execution-mode": "exact-rootfs-chroot"
    },
    "labels": {
      "app": "layerwise-performance-aisbench",
      "purpose": "performance-client"
    }
  },
  "spec": {
    "automountServiceAccountToken": false,
    "enableServiceLinks": false,
    "nodeName": "m1",
    "restartPolicy": "Always",
    "terminationGracePeriodSeconds": 10,
    "containers": [
      {
        "name": "aisbench",
        "image": "docker.io/library/vllm-ascend:kv-pool-layerwise-main-54503ece-a2-57d3c214e-df3f74ed-20260811T145302Z",
        "imagePullPolicy": "Never",
        "command": ["/bin/bash", "-lc"],
        "args": ["exec sleep infinity"],
        "env": [
          {"name": "PYTHONDONTWRITEBYTECODE", "value": "1"},
          {"name": "PYTHONUNBUFFERED", "value": "1"},
          {"name": "CLIENT_ROOTFS", "value": "/performance-workspace/rootfs"}
        ],
        "resources": {
          "requests": {"cpu": "4", "memory": "16Gi"},
          "limits": {"cpu": "8", "memory": "32Gi"}
        },
        "volumeMounts": [
          {"name": "workspace", "mountPath": "/performance-workspace"}
        ]
      }
    ],
    "volumes": [
      {"name": "workspace", "emptyDir": {"sizeLimit": "50Gi"}}
    ]
  }
}
