{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "layerwise-performance-aisbench",
    "namespace": "liangjiahao",
    "annotations": {
      "performance.vllm.ai/source-image": "docker.io/library/vllm-ascend:kv-pool-layerwise-main-54503ece-a2-45b2e785-df3f74ed-20260807T100722Z",
      "performance.vllm.ai/repo-digest": "sha256:411c381c0802547462636f897e73b986b01a3297577c7c3fe55c50d352c8e351"
    },
    "labels": {
      "app": "layerwise-performance-aisbench",
      "purpose": "performance-client"
    }
  },
  "spec": {
    "automountServiceAccountToken": false,
    "enableServiceLinks": false,
    "nodeName": "m1",
    "restartPolicy": "Always",
    "terminationGracePeriodSeconds": 10,
    "containers": [
      {
        "name": "aisbench",
        "image": "docker.io/library/vllm-ascend:kv-pool-layerwise-main-54503ece-a2-45b2e785-df3f74ed-20260807T100722Z",
        "imagePullPolicy": "Never",
        "command": ["/bin/bash", "-lc"],
        "args": ["exec sleep infinity"],
        "env": [
          {"name": "PYTHONDONTWRITEBYTECODE", "value": "1"},
          {"name": "PYTHONUNBUFFERED", "value": "1"}
        ],
        "resources": {
          "requests": {"cpu": "4", "memory": "16Gi"},
          "limits": {"cpu": "8", "memory": "32Gi"}
        },
        "volumeMounts": [
          {"name": "workspace", "mountPath": "/performance-workspace"}
        ]
      }
    ],
    "volumes": [
      {"name": "workspace", "emptyDir": {"sizeLimit": "50Gi"}}
    ]
  }
}
